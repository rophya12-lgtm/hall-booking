<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - College Resource Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>College Resource Booking</h1>
        <p>User Authentication Portal</p>
    </header>

    <div class="container" style="max-width: 480px; margin-top: 50px;">

        <div class="card">
            <h2 id="pageTitle" style="text-align: center; margin-bottom: 20px;">Sign In to Your Account</h2>

            <!-- Google Sign-In Button -->
            <button type="button" class="google-btn" id="googleSignInBtn">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Continue with Google
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>or continue with email</span>
            </div>

            <!-- Tabs: Log In vs Sign Up -->
            <div class="auth-tabs">
                <button type="button" class="tab-btn active" id="loginTabBtn">Log In</button>
                <button type="button" class="tab-btn" id="signupTabBtn">Sign Up</button>
            </div>

            <!-- Form -->
            <form id="authForm" onsubmit="return false;">
                <label for="email">College Email Address</label>
                <input type="email" id="email" placeholder="e.g. student@college.edu" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password" required>

                <div id="confirmPasswordGroup" style="display: none;">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
                </div>

                <button type="button" id="submitBtn">Log In</button>

                <div id="authMessage" class="feedback-msg"></div>
            </form>

            <div style="text-align: center; margin-top: 22px; font-size: 13px; color: #64748b; background: rgba(255,255,255,0.6); padding: 10px; border-radius: 8px;">
                🔒 <b>Protected Access:</b> Only authenticated department members can access the resource booking system.
            </div>
        </div>

    </div>

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <!-- Login Page Logic -->
    <script src="login.js"></script>

</body>
</html>
